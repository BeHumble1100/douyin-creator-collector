name: Smoke tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check userscript syntax
        run: node --check douyin-creator-collector.user.js
      - name: Run offline smoke tests
        run: node --test tests/script.test.cjs
